# 1. Use the standard PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. The Multi-Host JDBC Connection String (Separated by commas)
spring.datasource.url=jdbc:postgresql://192.168.136.129:26257,192.168.136.130:26257,192.168.136.131:26257/defaultdb?sslmode=disable

# 3. Authentication (Since you started with --insecure, use 'root' and leave password empty)
spring.datasource.username=root
spring.datasource.password=

# 4. Recommended JPA/Hibernate settings for CockroachDB
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true